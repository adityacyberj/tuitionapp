<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUITIONAPP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Kalam:wght@700&display=swap">
<style>
:root{
  --paper:#F2F5FB; --card:#FFFFFF; --ink:#1B2A5C; --muted:#5B6690; --line:#D5DCEE;
  --margin:#D64045; --ok:#1F8A57; --okbg:#DDF2E7; --badbg:#FBE1E2; --track:#E4E9F6;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#0F1530;--card:#18204A;--ink:#E8ECFF;--muted:#9AA5D6;--line:#2B3566;--margin:#F0686C;--ok:#52C98C;--okbg:#14382A;--badbg:#45202A;--track:#2B3566;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Hind",system-ui,sans-serif;font-size:16px;line-height:1.4;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 16px 10px;border-bottom:2px solid var(--margin);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:"Kalam",cursive,sans-serif;font-size:22px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
main{flex:1;overflow-y:auto;padding:12px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--margin);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.ok{border-left-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sum b{display:block;font-size:20px}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--badbg);color:var(--margin);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--ink);color:var(--paper);width:100%;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--margin);color:#fff}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.mini{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 9px;cursor:pointer;text-decoration:none;display:inline-block}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
h2{font-family:"Kalam",cursive,sans-serif;font-size:19px;margin:16px 0 6px}
.pa{font-family:"Kalam",cursive,sans-serif;font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok);flex:none}
.pa.a{background:var(--margin);color:#fff}.pa.n{background:var(--track);color:var(--muted)}
button.row{width:100%;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;font:inherit;font-weight:700;padding:14px 0;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--margin);box-shadow:inset 0 3px 0 var(--margin)}
input:focus-visible,select:focus-visible,.btn:focus-visible,.tab:focus-visible,.mini:focus-visible,button.row:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.login{max-width:380px;margin:40px auto;padding:0 16px;width:100%}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://zebkmbkdcsvjteiijgsq.supabase.co";
var SB_KEY="sb_publishable_7CF5WngGFMErT8AB6P7M6w_ox5GTBr_";
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(id){return document.getElementById(id)};
var uid=null,owner=null,batches=[],students=[],tab="fees",batchSel="";
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rs(n){return "₹"+Number(n).toLocaleString("en-IN")}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(toast.k);toast.k=setTimeout(function(){t.className=""},3000)}
function today(){return new Date().toLocaleDateString("en-CA")}
function fail(e){toast(e&&e.message?e.message:"Kuch gadbad hui, dobara try karo")}

/* ---------- Login ---------- */
function loginView(msg){
  $("root").innerHTML='<div class="login"><h1 style="font-size:28px">TUITIONAPP</h1><p class="sub">Tuition owner login</p>'+
   '<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">'+
   '<button class="btn alt" id="go">Login karo</button><p class="sub" id="err" style="color:var(--margin)">'+esc(msg||"")+'</p></div>';
  $("go").onclick=async function(){
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error){$("err").textContent="Login nahi hua: "+r.error.message;return}
    start()}}

/* ---------- App shell ---------- */
async function start(){
  var s=await sb.auth.getSession();
  if(!s.data.session){loginView();return}
  uid=s.data.session.user.id;
  var o=await sb.from("owners").select("*").eq("id",uid).maybeSingle();
  if(o.error){loginView(o.error.message);return}
  if(!o.data){loginView("Is login ke liye owner profile nahi bani. Pehle owners table mein is user ki row jodo.");return}
  owner=o.data;
  $("root").innerHTML='<header><div><h1>'+esc(owner.centre_name)+'</h1><div class="sub">'+esc(owner.owner_name)+'</div></div><button class="mini" id="out">Logout</button></header><main id="main"></main>'+
   '<nav role="tablist"><button class="tab" role="tab" data-t="fees">Fees</button><button class="tab" role="tab" data-t="att">Attendance</button><button class="tab" role="tab" data-t="stu">Students</button></nav>';
  $("out").onclick=async function(){await sb.auth.signOut();loginView()};
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){show(b.dataset.t)}});
  await loadBase();show("fees")}

async function loadBase(){
  var b=await sb.from("batches").select("*").order("class_name"),s=await sb.from("students").select("*").eq("active",true).order("name");
  if(b.error)fail(b.error);if(s.error)fail(s.error);
  batches=b.data||[];students=s.data||[];if(!batchSel&&batches.length)batchSel=batches[0].id}

async function show(t){tab=t;
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-selected",b.dataset.t===t)});
  $("main").innerHTML='<p class="sub">Load ho raha hai...</p>';
  if(t==="fees")await feesView();else if(t==="att")await attView();else stuView();
  $("main").scrollTop=0}

/* ---------- Fees ---------- */
async function feesView(){
  var r=await sb.from("fees").select("*, students(name,class_name,parent_whatsapp)").order("due_date",{ascending:true}).limit(200);
  if(r.error){fail(r.error);return}
  var rows=r.data||[],got=0,pend=0;
  rows.forEach(function(f){f.status==="paid"?got+=Number(f.amount):pend+=Number(f.amount)});
  rows.sort(function(a,b){return (a.status==="paid")-(b.status==="paid")});
  var h='<div class="sum"><div><b style="color:var(--ok)">'+rs(got)+'</b><span class="sub">Fees aayi</span></div><div><b style="color:var(--margin)">'+rs(pend)+'</b><span class="sub">Pending</span></div></div>'+
   '<button class="btn" id="gen">Is mahine ki fees banao</button><button class="btn alt" id="rem">Fee reminder queue karo</button>';
  h+='<h2>Fees list</h2>';
  if(!rows.length)h+='<p class="sub">Abhi koi fees nahi. Pehle Students tab mein batch aur students jodo, phir "Is mahine ki fees banao" dabao.</p>';
  rows.forEach(function(f){var s=f.students||{},paid=f.status==="paid",d=Math.floor((new Date()-new Date(f.due_date+"T00:00:00"))/864e5);
    var tg=paid?'<span class="tag ok">Jama</span>':(d>0?'<span class="tag">'+d+' din late</span>':'<span class="tag">Baaki</span>');
    var msg="Namaste, "+s.name+" ki fees "+rs(f.amount)+" baaki hai. Kripya jald jama karein. - "+owner.centre_name;
    h+='<div class="card'+(paid?' ok':'')+'"><div class="row"><div style="min-width:0"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+' · '+rs(f.amount)+' · '+esc(f.month.slice(0,7))+'</span></div>'+tg+'</div>';
    if(!paid)h+='<div style="margin-top:8px;display:flex;gap:6px"><a class="mini" target="_blank" href="https://wa.me/'+esc(s.parent_whatsapp)+'?text='+encodeURIComponent(msg)+'">WhatsApp</a><button class="mini" data-p="'+f.id+'">Jama karo</button></div>';
    h+='</div>'});
  $("main").innerHTML=h;
  $("gen").onclick=async function(){var x=await sb.rpc("generate_monthly_fees");x.error?fail(x.error):(toast("Fees ban gayi"),feesView())};
  $("rem").onclick=async function(){var x=await sb.rpc("queue_fee_reminders");x.error?fail(x.error):toast("Reminders queue mein gaye")};
  [].forEach.call(document.querySelectorAll("[data-p]"),function(b){b.onclick=async function(){
    var x=await sb.from("fees").update({status:"paid",paid_on:new Date().toISOString()}).eq("id",b.dataset.p);
    x.error?fail(x.error):(toast("Fees jama ho gayi"),feesView())}})}

/* ---------- Attendance ---------- */
async function attView(){
  if(!batches.length){$("main").innerHTML='<p class="sub">Pehle Students tab mein batch jodo.</p>';return}
  var list=students.filter(function(s){return s.batch_id===batchSel});
  var ids=list.map(function(s){return s.id}),map={};
  if(ids.length){var r=await sb.from("attendance").select("student_id,status").eq("date",today()).in("student_id",ids);
    if(r.error){fail(r.error);return}(r.data||[]).forEach(function(a){map[a.student_id]=a.status})}
  var h='<label for="bs">Batch</label><select id="bs">'+batches.map(function(b){return '<option value="'+b.id+'"'+(b.id===batchSel?' selected':'')+'>'+esc(b.name)+'</option>'}).join("")+'</select>'+
   '<div class="sub">Aaj: '+today()+'. Tap karke P/A badlo. Absent mark hote hi parent ka alert queue mein jata hai.</div><div style="margin-top:8px">';
  if(!list.length)h+='<p class="sub">Is batch mein koi student nahi.</p>';
  list.forEach(function(s){var st=map[s.id];
    h+='<div class="card'+(st==="A"?'':' ok')+'"><button class="row" data-s="'+s.id+'" data-v="'+(st||"")+'" aria-label="'+esc(s.name)+' ki attendance badlo"><div style="min-width:0"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+'</span></div><span class="pa'+(st==="A"?' a':st?'':' n')+'">'+(st||"-")+'</span></button></div>'});
  h+='</div>'+(list.length?'<button class="btn ghost" id="allp">Baaki sabko Present mark karo</button>':'');
  $("main").innerHTML=h;
  $("bs").onchange=function(){batchSel=this.value;attView()};
  async function save(rows){var x=await sb.from("attendance").upsert(rows,{onConflict:"student_id,date"});if(x.error)fail(x.error);else attView()}
  [].forEach.call(document.querySelectorAll("[data-s]"),function(b){b.onclick=function(){
    var s=students.find(function(z){return z.id===b.dataset.s});
    save([{owner_id:uid,student_id:s.id,batch_id:s.batch_id,date:today(),status:b.dataset.v==="P"?"A":"P"}])}});
  var ap=$("allp");if(ap)ap.onclick=function(){
    var rows=list.filter(function(s){return !map[s.id]}).map(function(s){return {owner_id:uid,student_id:s.id,batch_id:s.batch_id,date:today(),status:"P"}});
    rows.length?save(rows):toast("Sabki attendance lag chuki hai")}}

/* ---------- Students ---------- */
function stuView(){
  var h='<h2 style="margin-top:0">Batch jodo</h2><div class="card"><label for="bn">Batch ka naam</label><input id="bn" placeholder="Class 10 Maths"><label for="bc">Class</label><input id="bc" placeholder="10"><label for="bf">Monthly fees (Rs)</label><input id="bf" type="number" inputmode="numeric"><button class="btn" id="addb">Batch jodo</button></div>';
  h+='<h2>Student jodo</h2><div class="card"><label for="sn">Naam</label><input id="sn"><label for="sc">Class</label><input id="sc" placeholder="10"><label for="sp">Parent ka WhatsApp (10 digit)</label><input id="sp" type="tel" inputmode="numeric" maxlength="10"><label for="sb">Batch</label><select id="sb">'+
   batches.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join("")+'</select><button class="btn alt" id="adds">Student jodo</button></div>';
  h+='<h2>Students ('+students.length+')</h2>';
  students.forEach(function(s){var b=batches.find(function(x){return x.id===s.batch_id});
    h+='<div class="card ok"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+' · '+(b?esc(b.name):"batch nahi")+' · +'+esc(s.parent_whatsapp)+'</span></div>'});
  $("main").innerHTML=h;
  $("addb").onclick=async function(){var n=$("bn").value.trim(),c=$("bc").value.trim(),f=+$("bf").value;
    if(!n||!c||!(f>=0)||$("bf").value===""){toast("Batch ka naam, class aur fees teeno bharo");return}
    var x=await sb.from("batches").insert({owner_id:uid,name:n,class_name:c,monthly_fee:f});
    if(x.error)return fail(x.error);toast("Batch jud gaya");await loadBase();stuView()};
  $("adds").onclick=async function(){var n=$("sn").value.trim(),c=$("sc").value.trim(),p=$("sp").value.trim();
    if(!n||!c){toast("Naam aur class bharo");return}
    if(!/^\d{10}$/.test(p)){toast("WhatsApp number 10 digit ka hona chahiye");return}
    if(!$("sb").value){toast("Pehle batch jodo");return}
    var x=await sb.from("students").insert({owner_id:uid,batch_id:$("sb").value,name:n,class_name:c,parent_whatsapp:"91"+p});
    if(x.error)return fail(x.error);toast("Student jud gaya");await loadBase();stuView()}}

start();
</script>
</body>
</html>
