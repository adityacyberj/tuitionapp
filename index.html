<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUITIONAPP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Kalam:wght@700&display=swap">
<style>
:root{
  --paper:#F2F5FB; --card:#FFFFFF; --ink:#1B2A5C; --muted:#5B6690; --line:#D5DCEE;
  --margin:#D64045; --ok:#1F8A57; --okbg:#DDF2E7; --badbg:#FBE1E2; --track:#E4E9F6;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#0F1530;--card:#18204A;--ink:#E8ECFF;--muted:#9AA5D6;--line:#2B3566;--margin:#F0686C;--ok:#52C98C;--okbg:#14382A;--badbg:#45202A;--track:#2B3566;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Hind",system-ui,sans-serif;font-size:16px;line-height:1.4;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 16px 10px;border-bottom:2px solid var(--margin);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:"Kalam",cursive,sans-serif;font-size:22px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
main{flex:1;overflow-y:auto;padding:12px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--margin);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.ok{border-left-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sum b{display:block;font-size:20px}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--badbg);color:var(--margin);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--ink);color:var(--paper);width:100%;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--margin);color:#fff}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.mini{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 9px;cursor:pointer;text-decoration:none;display:inline-block}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
h2{font-family:"Kalam",cursive,sans-serif;font-size:19px;margin:16px 0 6px}
.pa{font-family:"Kalam",cursive,sans-serif;font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok);flex:none}
.pa.a{background:var(--margin);color:#fff}.pa.n{background:var(--track);color:var(--muted)}
button.row{width:100%;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;padding:14px 16px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--margin);box-shadow:inset 0 3px 0 var(--margin)}
input:focus-visible,select:focus-visible,.btn:focus-visible,.tab:focus-visible,.mini:focus-visible,button.row:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.login{max-width:380px;margin:40px auto;padding:0 16px;width:100%}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://zebkmbkdcsvjteiijgsq.supabase.co";
var SB_KEY="sb_publishable_7CF5WngGFMErT8AB6P7M6w_ox5GTBr_";
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(id){return document.getElementById(id)};
var uid=null,owner=null,batches=[],students=[],tab="fees",batchSel="";
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rs(n){return "₹"+Number(n).toLocaleString("en-IN")}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(toast.k);toast.k=setTimeout(function(){t.className=""},3000)}
function today(){return new Date().toLocaleDateString("en-CA")}
function fail(e){toast(e&&e.message?e.message:"Kuch gadbad hui, dobara try karo")}

/* ---------- Login / Signup ---------- */
function loginView(msg,mode){
  mode=mode||"in";var up=mode==="up";
  var h='<div class="login"><h1 style="font-size:28px">TUITIONAPP</h1><p class="sub">'+(up?"Naya tuition centre account":"Tuition owner login")+'</p>'+
   '<label for="em">Email</label><input id="em" type="email" autocomplete="username">'+
   '<label for="pw">Password'+(up?" (kam se kam 8 akshar)":"")+'</label><input id="pw" type="password" autocomplete="'+(up?"new-password":"current-password")+'">'+
   '<button class="btn alt" id="go">'+(up?"Account banao":"Login karo")+'</button><p class="sub" id="err" style="color:var(--margin)">'+esc(msg||"")+'</p>'+
   '<button class="btn ghost" id="sw">'+(up?"Pehle se account hai? Login karo":"Naya account banao")+'</button></div>';
  $("root").innerHTML=h;
  $("sw").onclick=function(){loginView("",up?"in":"up")};
  $("go").onclick=async function(){
    var em=$("em").value.trim(),pw=$("pw").value;
    if(!em||!pw){$("err").textContent="Email aur password daalo";return}
    if(up){
      if(pw.length<8){$("err").textContent="Password kam se kam 8 akshar ka rakho";return}
      var r=await sb.auth.signUp({email:em,password:pw});
      if(r.error){$("err").textContent="Account nahi bana: "+r.error.message;return}
      if(!r.data.session){loginView("Email par confirm link bheja hai. Confirm karke login karo.","in");return}
      start();return}
    var r2=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r2.error){$("err").textContent="Login nahi hua: "+r2.error.message;return}
    start()}}

function profileView(){
  $("root").innerHTML='<div class="login"><h1 style="font-size:28px">Centre ki jaankari</h1><p class="sub">Bas ek baar bharni hai</p>'+
   '<label for="pc">Tuition centre ka naam</label><input id="pc"><label for="po">Aapka naam</label><input id="po">'+
   '<label for="pwa">Aapka WhatsApp number (10 digit)</label><input id="pwa" type="tel" inputmode="numeric" maxlength="10">'+
   '<button class="btn alt" id="psave">Shuru karo</button><p class="sub" id="perr" style="color:var(--margin)"></p><button class="btn ghost" id="pout">Logout</button></div>';
  $("pout").onclick=async function(){await sb.auth.signOut();loginView()};
  $("psave").onclick=async function(){
    var c=$("pc").value.trim(),n=$("po").value.trim(),w=$("pwa").value.replace(/\D/g,"");
    if(!c||!n){$("perr").textContent="Centre ka naam aur aapka naam daalo";return}
    if(w.length!==10){$("perr").textContent="WhatsApp number 10 digit ka hona chahiye";return}
    var x=await sb.from("owners").insert({id:uid,centre_name:c,owner_name:n,whatsapp:"91"+w});
    if(x.error){$("perr").textContent=x.error.message;return}
    start()}}

/* ---------- App shell ---------- */
async function start(){
  var s=await sb.auth.getSession();
  if(!s.data.session){loginView();return}
  uid=s.data.session.user.id;
  var o=await sb.from("owners").select("*").eq("id",uid).maybeSingle();
  if(o.error){loginView(o.error.message);return}
  if(!o.data){profileView();return}
  owner=o.data;
  $("root").innerHTML='<header><div><h1>'+esc(owner.centre_name)+'</h1><div class="sub">'+esc(owner.owner_name)+'</div></div><button class="mini" id="out">Logout</button></header><main id="main"></main>'+
   '<nav role="tablist"><button class="tab" role="tab" data-t="home">Home</button><button class="tab" role="tab" data-t="fees">Fees</button><button class="tab" role="tab" data-t="att">Attendance</button><button class="tab" role="tab" data-t="hw">Homework</button><button class="tab" role="tab" data-t="tst">Tests</button><button class="tab" role="tab" data-t="enq">Enquiries</button><button class="tab" role="tab" data-t="stu">Students</button></nav>';
  $("out").onclick=async function(){await sb.auth.signOut();loginView()};
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){show(b.dataset.t)}});
  await loadBase();show("home")}

async function loadBase(){
  var b=await sb.from("batches").select("*").order("class_name"),s=await sb.from("students").select("*").eq("active",true).order("name");
  if(b.error)fail(b.error);if(s.error)fail(s.error);
  batches=b.data||[];students=s.data||[];if(!batchSel&&batches.length)batchSel=batches[0].id}

async function show(t){tab=t;
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-selected",b.dataset.t===t)});
  $("main").innerHTML='<p class="sub">Load ho raha hai...</p>';
  if(t==="home")await dashView();else if(t==="enq")await enqView();else if(t==="fees")await feesView();else if(t==="att")await attView();else if(t==="hw")await hwView();else if(t==="tst")await tstView();else stuView();
  $("main").scrollTop=0}

/* ---------- Home (dashboard) ---------- */
async function dashView(){
  var now=new Date(),m1=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01",td=today();
  var f=await sb.from("fees").select("amount,status,due_date,month,students(name,parent_whatsapp)");
  var at=await sb.from("attendance").select("student_id,status").eq("date",td);
  var en=await sb.from("enquiries").select("status");
  if(f.error||at.error||en.error){fail(f.error||at.error||en.error);return}
  var got=0,pend=0,old=0,late=[];
  (f.data||[]).forEach(function(x){var a=Number(x.amount),paid=x.status==="paid";
    if(x.month>=m1){paid?got+=a:pend+=a}else if(!paid)old+=a;
    if(!paid&&x.due_date<td)late.push({name:(x.students||{}).name,wa:(x.students||{}).parent_whatsapp,amt:a,days:Math.floor((now-new Date(x.due_date+"T00:00:00"))/864e5)})});
  late.sort(function(a,b){return b.days-a.days});
  var pct=got+pend?Math.round(got/(got+pend)*100):0;
  var P=0,absn=[];(at.data||[]).forEach(function(r){if(r.status==="P")P++;else{var s=students.find(function(z){return z.id===r.student_id});absn.push(s?s.name:"?")}});
  var unmarked=Math.max(0,students.length-(at.data||[]).length);
  var ec={new:0,contacted:0,joined:0,dropped:0};(en.data||[]).forEach(function(e){ec[e.status]=(ec[e.status]||0)+1});
  var h='<div class="card ok"><div class="row"><span><b>Is mahine ki fees</b></span><span class="sub">'+pct+'% aayi</span></div>'+
   '<div class="sum" style="margin:8px 0 0"><div><b style="color:var(--ok)">'+rs(got)+'</b><span class="sub">Aayi</span></div><div><b style="color:var(--margin)">'+rs(pend)+'</b><span class="sub">Pending</span></div></div>'+
   '<div class="bar" style="height:12px;border-radius:6px;background:var(--badbg);overflow:hidden;margin-top:8px" role="img" aria-label="'+pct+' percent fees aayi"><i style="display:block;height:100%;width:'+pct+'%;background:var(--ok)"></i></div>'+
   (old>0?'<div class="sub" style="margin-top:6px">Pichhle mahino ki baaki fees: '+rs(old)+'</div>':'')+'</div>';
  h+='<div class="sum"><div><b>'+students.length+'</b><span class="sub">Kul students</span></div><div><b>'+batches.length+'</b><span class="sub">Batch</span></div></div>';
  h+='<h2>Late fees ('+late.length+')</h2>';
  if(!late.length)h+='<div class="card ok"><span class="sub">Koi late fees nahi. Badhiya!</span></div>';
  late.forEach(function(x){var msg="Namaste, "+x.name+" ki fees "+rs(x.amt)+" baaki hai ("+x.days+" din late). Kripya jald jama karein. - "+owner.centre_name;
    h+='<div class="card"><div class="row"><div style="min-width:0"><b>'+esc(x.name)+'</b><span class="sub">'+rs(x.amt)+'</span></div><span class="tag">'+x.days+' din late</span></div><div style="margin-top:8px"><a class="mini" target="_blank" href="https://wa.me/'+esc(x.wa)+'?text='+encodeURIComponent(msg)+'">WhatsApp reminder</a></div></div>'});
  h+='<h2>Aaj ki attendance</h2><div class="card ok"><div class="row"><span>Present '+P+'</span><span style="color:var(--margin)">Absent '+absn.length+'</span></div><div class="sub">'+(absn.length?'Absent: '+esc(absn.join(", ")):'Koi absent nahi')+(unmarked?' · '+unmarked+' ki attendance baaki':'')+'</div></div>';
  h+='<h2>Refer a friend</h2><div class="card"><div class="row"><span>Kul enquiries '+((en.data||[]).length)+'</span><span class="sub">Join kiya: '+ec.joined+'</span></div><div class="sub">Naye: '+ec.new+' · Baat hui: '+ec.contacted+' · Nahi aaye: '+ec.dropped+'</div></div>';
  $("main").innerHTML=h}

/* ---------- Enquiries (Refer a friend) ---------- */
var ST=["new","contacted","joined","dropped"],LB={new:"Naya",contacted:"Baat hui",joined:"Join kiya",dropped:"Nahi aaya"};
async function enqView(){
  var r=await sb.from("enquiries").select("*").order("created_at",{ascending:false}).limit(100);
  if(r.error){fail(r.error);return}
  var E=r.data||[];
  var h='<h2 style="margin-top:0">Naya enquiry</h2><div class="card"><label for="en">Naam</label><input id="en"><label for="ep">Phone (10 digit)</label><input id="ep" type="tel" inputmode="numeric" maxlength="10"><label for="ec">Class</label><input id="ec" placeholder="10"><label for="eb">Kisne refer kiya</label><select id="eb"><option value="">Koi nahi</option>'+
   students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join("")+'</select><button class="btn alt" id="adde">Enquiry jodo</button></div><h2>Enquiries ('+E.length+')</h2>';
  if(!E.length)h+='<p class="sub">Abhi koi enquiry nahi.</p>';
  var tally={};
  E.forEach(function(e){var by=students.find(function(z){return z.id===e.referred_by_student});if(by)tally[by.name]=(tally[by.name]||0)+1;
    var msg="Namaste "+e.name+", "+(by?by.name+" ne aapko hamare tuition centre ke baare mein bataya. ":"")+"Demo class ke liye aap kab aa sakte hain? - "+owner.centre_name;
    h+='<div class="card'+(e.status==="joined"?' ok':'')+'"><div class="row"><div style="min-width:0"><b>'+esc(e.name)+'</b><span class="sub">'+(e.class_name?'Class '+esc(e.class_name)+' · ':'')+(by?'Refer: '+esc(by.name):'Seedha enquiry')+'</span></div><button class="mini" data-st="'+e.id+'" data-v="'+e.status+'" aria-label="Status badlo, abhi '+LB[e.status]+'">'+LB[e.status]+'</button></div>'+
     '<div style="margin-top:8px;display:flex;gap:6px"><a class="mini" href="tel:+91'+esc(e.phone)+'">Call</a><a class="mini" target="_blank" href="https://wa.me/91'+esc(e.phone)+'?text='+encodeURIComponent(msg)+'">WhatsApp</a></div></div>'});
  var top=Object.keys(tally).sort(function(a,b){return tally[b]-tally[a]}).slice(0,3);
  if(top.length)h+='<h2>Sabse zyada refer karne wale</h2><div class="card ok">'+top.map(function(k){return '<div class="row" style="padding:3px 0"><span>'+esc(k)+'</span><span>'+tally[k]+'</span></div>'}).join("")+'</div>';
  $("main").innerHTML=h;
  $("adde").onclick=async function(){var n=$("en").value.trim(),p=$("ep").value.trim();
    if(!n){toast("Naam daalo");return}
    if(!/^\d{10}$/.test(p)){toast("Phone 10 digit ka hona chahiye");return}
    var x=await sb.from("enquiries").insert({owner_id:uid,name:n,phone:p,class_name:$("ec").value.trim()||null,referred_by_student:$("eb").value||null,status:"new"});
    x.error?fail(x.error):(toast("Enquiry jud gayi"),enqView())};
  [].forEach.call(document.querySelectorAll("[data-st]"),function(b){b.onclick=async function(){
    var nx=ST[(ST.indexOf(b.dataset.v)+1)%ST.length],x=await sb.from("enquiries").update({status:nx}).eq("id",b.dataset.st);
    x.error?fail(x.error):(toast(LB[nx]),enqView())}})}

/* ---------- Fees ---------- */
async function feesView(){
  var r=await sb.from("fees").select("*, students(name,class_name,parent_whatsapp)").order("due_date",{ascending:true}).limit(200);
  if(r.error){fail(r.error);return}
  var rows=r.data||[],got=0,pend=0;
  rows.forEach(function(f){f.status==="paid"?got+=Number(f.amount):pend+=Number(f.amount)});
  rows.sort(function(a,b){return (a.status==="paid")-(b.status==="paid")});
  var h='<div class="sum"><div><b style="color:var(--ok)">'+rs(got)+'</b><span class="sub">Fees aayi</span></div><div><b style="color:var(--margin)">'+rs(pend)+'</b><span class="sub">Pending</span></div></div>'+
   '<button class="btn" id="gen">Is mahine ki fees banao</button><button class="btn alt" id="rem">Fee reminder queue karo</button>';
  h+='<h2>Fees list</h2>';
  if(!rows.length)h+='<p class="sub">Abhi koi fees nahi. Pehle Students tab mein batch aur students jodo, phir "Is mahine ki fees banao" dabao.</p>';
  rows.forEach(function(f){var s=f.students||{},paid=f.status==="paid",d=Math.floor((new Date()-new Date(f.due_date+"T00:00:00"))/864e5);
    var tg=paid?'<span class="tag ok">Jama</span>':(d>0?'<span class="tag">'+d+' din late</span>':'<span class="tag">Baaki</span>');
    var msg="Namaste, "+s.name+" ki fees "+rs(f.amount)+" baaki hai. Kripya jald jama karein. - "+owner.centre_name;
    h+='<div class="card'+(paid?' ok':'')+'"><div class="row"><div style="min-width:0"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+' · '+rs(f.amount)+' · '+esc(f.month.slice(0,7))+'</span></div>'+tg+'</div>';
    if(!paid)h+='<div style="margin-top:8px;display:flex;gap:6px"><a class="mini" target="_blank" href="https://wa.me/'+esc(s.parent_whatsapp)+'?text='+encodeURIComponent(msg)+'">WhatsApp</a><button class="mini" data-p="'+f.id+'">Jama karo</button></div>';
    h+='</div>'});
  $("main").innerHTML=h;
  $("gen").onclick=async function(){var x=await sb.rpc("generate_monthly_fees");x.error?fail(x.error):(toast("Fees ban gayi"),feesView())};
  $("rem").onclick=async function(){var x=await sb.rpc("queue_fee_reminders");x.error?fail(x.error):toast("Reminders queue mein gaye")};
  [].forEach.call(document.querySelectorAll("[data-p]"),function(b){b.onclick=async function(){
    var x=await sb.from("fees").update({status:"paid",paid_on:new Date().toISOString()}).eq("id",b.dataset.p);
    x.error?fail(x.error):(toast("Fees jama ho gayi"),feesView())}})}

/* ---------- Attendance ---------- */
async function attView(){
  if(!batches.length){$("main").innerHTML='<p class="sub">Pehle Students tab mein batch jodo.</p>';return}
  var list=students.filter(function(s){return s.batch_id===batchSel});
  var ids=list.map(function(s){return s.id}),map={};
  if(ids.length){var r=await sb.from("attendance").select("student_id,status").eq("date",today()).in("student_id",ids);
    if(r.error){fail(r.error);return}(r.data||[]).forEach(function(a){map[a.student_id]=a.status})}
  var h='<label for="bs">Batch</label><select id="bs">'+batches.map(function(b){return '<option value="'+b.id+'"'+(b.id===batchSel?' selected':'')+'>'+esc(b.name)+'</option>'}).join("")+'</select>'+
   '<div class="sub">Aaj: '+today()+'. Tap karke P/A badlo. Absent mark hote hi parent ka alert queue mein jata hai.</div><div style="margin-top:8px">';
  if(!list.length)h+='<p class="sub">Is batch mein koi student nahi.</p>';
  list.forEach(function(s){var st=map[s.id];
    h+='<div class="card'+(st==="A"?'':' ok')+'"><button class="row" data-s="'+s.id+'" data-v="'+(st||"")+'" aria-label="'+esc(s.name)+' ki attendance badlo"><div style="min-width:0"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+'</span></div><span class="pa'+(st==="A"?' a':st?'':' n')+'">'+(st||"-")+'</span></button></div>'});
  h+='</div>'+(list.length?'<button class="btn ghost" id="allp">Baaki sabko Present mark karo</button>':'');
  $("main").innerHTML=h;
  $("bs").onchange=function(){batchSel=this.value;attView()};
  async function save(rows){var x=await sb.from("attendance").upsert(rows,{onConflict:"student_id,date"});if(x.error)fail(x.error);else attView()}
  [].forEach.call(document.querySelectorAll("[data-s]"),function(b){b.onclick=function(){
    var s=students.find(function(z){return z.id===b.dataset.s});
    save([{owner_id:uid,student_id:s.id,batch_id:s.batch_id,date:today(),status:b.dataset.v==="P"?"A":"P"}])}});
  var ap=$("allp");if(ap)ap.onclick=function(){
    var rows=list.filter(function(s){return !map[s.id]}).map(function(s){return {owner_id:uid,student_id:s.id,batch_id:s.batch_id,date:today(),status:"P"}});
    rows.length?save(rows):toast("Sabki attendance lag chuki hai")}}

/* ---------- Homework ---------- */

   '<div class="card"><label for="ht">Homework</label><input id="ht" placeholder="Maths: Ex 4.2 Q1-10"><label for="hd">Details (optional)</label><input id="hd"><label for="hu">Jama karne ki tareekh</label><input id="hu" type="date"><button class="btn alt" id="addh">Homework jodo</button></div><h2>Pichhla homework</h2>';

/* ---------- Tests ---------- */
var testSel="";
function rankOf(vals){return vals.map(function(v){return v==null?null:1+vals.filter(function(o){return o!=null&&o>v}).length})}
async function tstView(){
  if(!batches.length){$("main").innerHTML='<p class="sub">Pehle Students tab mein batch jodo.</p>';return}
  var r=await sb.from("tests").select("*").eq("batch_id",batchSel).order("test_date",{ascending:false}).limit(10);
  if(r.error){fail(r.error);return}
  var tests=r.data||[];
  if(!tests.find(function(t){return t.id===testSel}))testSel=tests.length?tests[0].id:"";
  var cur=tests.find(function(t){return t.id===testSel}),list=students.filter(function(s){return s.batch_id===batchSel}),marks={};
  if(cur){var m=await sb.from("test_marks").select("student_id,marks").eq("test_id",cur.id);
    if(m.error){fail(m.error);return}(m.data||[]).forEach(function(x){marks[x.student_id]=Number(x.marks)})}
  var h='<label for="tb">Batch</label><select id="tb">'+batches.map(function(b){return '<option value="'+b.id+'"'+(b.id===batchSel?' selected':'')+'>'+esc(b.name)+'</option>'}).join("")+'</select>'+
   '<h2 style="margin-top:0">Naya test</h2><div class="card"><label for="tt">Test ka naam</label><input id="tt" placeholder="Weekly Test 4"><label for="tm">Total marks</label><input id="tm" type="number" inputmode="numeric" value="50"><label for="td">Tareekh</label><input id="td" type="date" value="'+today()+'"><button class="btn" id="addt">Test banao</button></div>';
  if(cur){
    h+='<h2>Marks daalo</h2><label for="ts">Test chuno</label><select id="ts">'+tests.map(function(t){return '<option value="'+t.id+'"'+(t.id===testSel?' selected':'')+'>'+esc(t.title)+' ('+esc(t.test_date)+')</option>'}).join("")+'</select>'+
     '<div class="sum"><div><b id="tavg">-</b><span class="sub">Class average</span></div><div><b id="ttop">-</b><span class="sub">Sabse zyada (max '+cur.max_marks+')</span></div></div>';
    if(!list.length)h+='<p class="sub">Is batch mein koi student nahi.</p>';
    list.forEach(function(s){h+='<div class="card ok"><div class="row"><div style="min-width:0"><b>'+esc(s.name)+'</b><span class="sub" data-rk="'+s.id+'">Rank: -</span></div><input class="mk" type="number" inputmode="decimal" min="0" max="'+cur.max_marks+'" data-s="'+s.id+'" value="'+(marks[s.id]==null?"":marks[s.id])+'" style="width:90px;margin:0" aria-label="'+esc(s.name)+' ke marks"></div><button class="mini" data-rep="'+s.id+'" style="margin-top:8px">Parent ko report bhejo</button></div>'});
    if(list.length)h+='<button class="btn alt" id="savem">Marks save karo</button>';
  }else h+='<p class="sub">Is batch ka abhi koi test nahi. Upar se naya test banao.</p>';
  $("main").innerHTML=h;
  function vals(){var o={};[].forEach.call(document.querySelectorAll(".mk"),function(e){o[e.dataset.s]=e.value===""?null:Math.min(+cur.max_marks,Math.max(0,+e.value))});return o}
  function upd(){if(!cur)return;var o=vals(),ids=list.map(function(s){return s.id}),v=ids.map(function(i){return o[i]}),rk=rankOf(v),have=v.filter(function(x){return x!=null});
    ids.forEach(function(id,i){var e=document.querySelector('[data-rk="'+id+'"]');if(e)e.textContent="Rank: "+(rk[i]==null?"-":"#"+rk[i]+" / "+have.length)});
    $("tavg").textContent=have.length?(have.reduce(function(a,b){return a+b},0)/have.length).toFixed(1):"-";
    $("ttop").textContent=have.length?Math.max.apply(null,have):"-"}
  $("tb").onchange=function(){batchSel=this.value;testSel="";tstView()};
  $("addt").onclick=async function(){var t=$("tt").value.trim(),mx=+$("tm").value;
    if(!t||!(mx>0)){toast("Test ka naam aur total marks bharo");return}
    var x=await sb.from("tests").insert({owner_id:uid,batch_id:batchSel,title:t,test_date:$("td").value||today(),max_marks:mx}).select().single();
    if(x.error)return fail(x.error);testSel=x.data.id;toast("Test ban gaya");tstView()};
  if(cur){
    $("ts").onchange=function(){testSel=this.value;tstView()};
    [].forEach.call(document.querySelectorAll(".mk"),function(e){e.oninput=upd});upd();
    $("savem").onclick=async function(){var o=vals(),rows=[];
      list.forEach(function(s){if(o[s.id]!=null)rows.push({test_id:cur.id,student_id:s.id,marks:o[s.id]})});
      if(!rows.length){toast("Kam se kam ek bachche ke marks daalo");return}
      var x=await sb.from("test_marks").upsert(rows,{onConflict:"test_id,student_id"});
      x.error?fail(x.error):(toast("Marks save ho gaye"),tstView())};
    [].forEach.call(document.querySelectorAll("[data-rep]"),function(b){b.onclick=function(){
      var o=vals(),id=b.dataset.rep,s=students.find(function(z){return z.id===id}),m=o[id];
      if(m==null){toast("Pehle "+s.name+" ke marks daalo");return}
      var ids=list.map(function(z){return z.id}),v=ids.map(function(i){return o[i]}),rk=rankOf(v)[ids.indexOf(id)],n=v.filter(function(x){return x!=null}).length,pc=Math.round(m/cur.max_marks*100);
      var msg="Test report - "+s.name+"\n"+cur.title+": "+m+"/"+cur.max_marks+" ("+pc+"%)\nBatch rank: "+rk+" / "+n+"\nPoora report: "+location.origin+"/parent.html?t="+s.parent_token+"\n- "+owner.centre_name;
      window.open("https://wa.me/"+s.parent_whatsapp+"?text="+encodeURIComponent(msg),"_blank")}})}
}

/* ---------- CSV / paste import ---------- */
var IMP=[];
function importCard(){
  return '<h2>Bachche ek saath jodo</h2><div class="card"><p class="sub">Har line mein: Naam, Class, Parent ka WhatsApp, Batch (batch likhna zaroori nahi). Excel ya Sheet se copy karke paste karo, ya CSV file chuno.</p>'+
   '<label for="ib">Batch (jis line mein batch na ho uske liye)</label><select id="ib"><option value="">-</option>'+batches.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join("")+'</select>'+
   '<label for="ifile">CSV file</label><input id="ifile" type="file" accept=".csv,.txt,text/csv,text/plain">'+
   '<label for="itxt">Ya yahan paste karo</label><textarea id="itxt" rows="6" placeholder="Aarav Sharma, 10, 9876543210, Class 10 Maths"></textarea>'+
   '<button class="btn" id="icheck">Check karo</button><div id="iprev"></div></div>'}
function splitLine(l){
  if(l.indexOf("\t")>=0)return l.split("\t").map(function(x){return x.trim()});
  var out=[],cur="",q=false;
  for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"')q=!q;else if(ch===","&&!q){out.push(cur.trim());cur=""}else cur+=ch}
  out.push(cur.trim());return out}
function normPhone(x){var d=String(x||"").replace(/\D/g,"");
  if(d.length===10)return "91"+d;if(d.length===11&&d[0]==="0")return "91"+d.slice(1);if(d.length===12&&d.slice(0,2)==="91")return d;return null}
function parseImport(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean),rows=[],seen={},dflt=$("ib").value;
  lines.forEach(function(l,i){var c=splitLine(l);
    if(i===0&&/^(naam|name|student)/i.test(c[0]||""))return;
    var r={n:(c[0]||"").trim(),cl:(c[1]||"").trim(),ph:normPhone(c[2]),b:(c[3]||"").trim(),err:""};
    if(!r.n)r.err="naam nahi";else if(!r.cl)r.err="class nahi";else if(!r.ph)r.err="phone galat";
    else if(!r.b&&!dflt)r.err="batch nahi chuna";
    else{var key=r.n.toLowerCase()+"|"+r.ph;
      if(seen[key])r.err="file mein dobara";
      else if(students.some(function(z){return z.name.toLowerCase()===r.n.toLowerCase()&&z.parent_whatsapp===r.ph}))r.err="pehle se jura hai";
      seen[key]=1}
    rows.push(r)});
  return rows}
function bindImport(){
  $("ifile").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){$("itxt").value=String(rd.result||"");toast("File padh li, ab Check karo dabao")};
    rd.onerror=function(){toast("File padh nahi paye")};rd.readAsText(f)};
  $("icheck").onclick=function(){
    IMP=parseImport($("itxt").value);
    if(!IMP.length){$("iprev").innerHTML='<p class="sub">Koi line nahi mili.</p>';return}
    var ok=IMP.filter(function(r){return !r.err}),bad=IMP.length-ok.length;
    var h='<p style="margin:10px 0 4px"><b style="color:var(--ok)">'+ok.length+' sahi</b>'+(bad?' · <b style="color:var(--margin)">'+bad+' galat (ye jode nahi jayenge)</b>':'')+'</p>';
    IMP.slice(0,60).forEach(function(r){h+='<div class="sub" style="padding:2px 0;color:'+(r.err?'var(--margin)':'var(--muted)')+'">'+(r.err?'✗ ':'✓ ')+esc(r.n||"?")+' · '+esc(r.cl)+' · '+(r.ph?'+'+r.ph:'?')+(r.b?' · '+esc(r.b):'')+(r.err?' ('+r.err+')':'')+'</div>'});
    if(IMP.length>60)h+='<div class="sub">... aur '+(IMP.length-60)+' lines</div>';
    if(ok.length)h+='<button class="btn alt" id="idoit">Import karo ('+ok.length+')</button>';
    $("iprev").innerHTML=h;
    var go=$("idoit");if(go)go.onclick=async function(){
      go.disabled=true;go.textContent="Ho raha hai...";
      var dflt=batches.find(function(b){return b.id===$("ib").value}),valid=IMP.filter(function(r){return !r.err}),map={};
      batches.forEach(function(b){map[b.name.toLowerCase()]=b.id});
      var need={};valid.forEach(function(r){var nm=r.b||(dflt&&dflt.name);if(nm&&!map[nm.toLowerCase()]&&!need[nm.toLowerCase()])need[nm.toLowerCase()]={name:nm,cl:r.cl}});
      var nk=Object.keys(need);
      if(nk.length){var nb=await sb.from("batches").insert(nk.map(function(k){return {owner_id:uid,name:need[k].name,class_name:need[k].cl,monthly_fee:0}})).select();
        if(nb.error){fail(nb.error);go.disabled=false;go.textContent="Dobara try karo";return}
        nb.data.forEach(function(b){map[b.name.toLowerCase()]=b.id})}
      var rows=valid.map(function(r){var nm=r.b||(dflt&&dflt.name);return {owner_id:uid,batch_id:map[nm.toLowerCase()],name:r.n,class_name:r.cl,parent_whatsapp:r.ph}});
      for(var i=0;i<rows.length;i+=100){var x=await sb.from("students").insert(rows.slice(i,i+100));
        if(x.error){fail(x.error);go.disabled=false;go.textContent="Dobara try karo";return}}
      await loadBase();
      toast(rows.length+" bachche jud gaye"+(nk.length?" ("+nk.length+" naya batch bana, uski fees Rs 0 hai, Batch jodo se theek karo)":""));
      stuView()}}}

/* ---------- Account (password badlo) ---------- */
function accountCard(){
  return '<h2>Account</h2><div class="card"><label for="np">Naya password (kam se kam 8 akshar)</label><input id="np" type="password" autocomplete="new-password"><button class="btn" id="chpw">Password badlo</button><p class="sub" style="margin-top:8px">Password bhool gaye? Apne tuition app wale se sampark karein.</p></div>'}
function bindAccount(){
  $("chpw").onclick=async function(){var v=$("np").value;
    if(v.length<8){toast("Password kam se kam 8 akshar ka rakho");return}
    var x=await sb.auth.updateUser({password:v});
    if(x.error){fail(x.error);return}
    $("np").value="";toast("Password badal gaya")}}

function bindLinks(){
  [].forEach.call(document.querySelectorAll("[data-nl]"),function(b){b.onclick=async function(){
    var s=students.find(function(z){return z.id===b.dataset.nl});
    if(!s||!confirm(s.name+" ka purana parent link band ho jayega. Naya link banayein?"))return;
    var x=await sb.from("students").update({parent_token:crypto.randomUUID()}).eq("id",s.id);
    if(x.error)return fail(x.error);

/* ---------- Students ---------- */
function stuView(){
  var h='<h2 style="margin-top:0">Fees ka UPI ID</h2><div class="card"><label for="upi">UPI ID (parent isi par fees dega)</label><input id="upi" placeholder="naam@bank" value="'+esc(owner.upi_id)+'"><button class="btn" id="saveupi">UPI ID save karo</button></div>'+importCard()+'<h2>Batch jodo</h2><div class="card"><label for="bn">Batch ka naam</label><input id="bn" placeholder="Class 10 Maths"><label for="bc">Class</label><input id="bc" placeholder="10"><label for="bf">Monthly fees (Rs)</label><input id="bf" type="number" inputmode="numeric"><button class="btn" id="addb">Batch jodo</button></div>';
  h+='<h2>Student jodo</h2><div class="card"><label for="sn">Naam</label><input id="sn"><label for="sc">Class</label><input id="sc" placeholder="10"><label for="sp">Parent ka WhatsApp (10 digit)</label><input id="sp" type="tel" inputmode="numeric" maxlength="10"><label for="sb">Batch</label><select id="sb">'+
   batches.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join("")+'</select><button class="btn alt" id="adds">Student jodo</button></div>';
  h+='<h2>Students ('+students.length+')</h2>';
  students.forEach(function(s){var b=batches.find(function(x){return x.id===s.batch_id});
    var link=location.origin+"/parent.html?t="+s.parent_token,msg="Namaste, "+s.name+" ki attendance, homework aur fees yahan dekhein: "+link+" - "+owner.centre_name;
    h+='<div class="card ok"><b>'+esc(s.name)+'</b><span class="sub">Class '+esc(s.class_name)+' · '+(b?esc(b.name):"batch nahi")+' · +'+esc(s.parent_whatsapp)+'</span><div style="margin-top:8px;display:flex;gap:6px"><a class="mini" target="_blank" href="https://wa.me/'+esc(s.parent_whatsapp)+'?text='+encodeURIComponent(msg)+'">Parent link bhejo</a><button class="mini" data-cp="'+esc(link)+'">Link copy</button><button class="mini" data-nl="'+s.id+'">Naya link</button></div></div>'});
  h+=accountCard();
  $("main").innerHTML=h;
  bindImport();bindAccount();bindLinks();
  $("saveupi").onclick=async function(){var v=$("upi").value.trim();
    if(v&&!/^[\w.\-]{2,}@[\w.\-]{2,}$/.test(v)){toast("UPI ID aise likho: naam@bank");return}
    var x=await sb.from("owners").update({upi_id:v||null}).eq("id",uid);
    x.error?fail(x.error):(owner.upi_id=v||null,toast("UPI ID save ho gaya"))};
  [].forEach.call(document.querySelectorAll("[data-cp]"),function(b){b.onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(b.dataset.cp):Promise.reject()).then(function(){toast("Link copy ho gaya")},function(){toast("Copy nahi hua, Parent link bhejo dabao")})}});
  $("addb").onclick=async function(){var n=$("bn").value.trim(),c=$("bc").value.trim(),f=+$("bf").value;
    if(!n||!c||!(f>=0)||$("bf").value===""){toast("Batch ka naam, class aur fees teeno bharo");return}
    var x=await sb.from("batches").insert({owner_id:uid,name:n,class_name:c,monthly_fee:f});
    if(x.error)return fail(x.error);toast("Batch jud gaya");await loadBase();stuView()};
  $("adds").onclick=async function(){var n=$("sn").value.trim(),c=$("sc").value.trim(),p=$("sp").value.trim();
    if(!n||!c){toast("Naam aur class bharo");return}
    if(!/^\d{10}$/.test(p)){toast("WhatsApp number 10 digit ka hona chahiye");return}
    if(!$("sb").value){toast("Pehle batch jodo");return}
    var x=await sb.from("students").insert({owner_id:uid,batch_id:$("sb").value,name:n,class_name:c,parent_whatsapp:"91"+p});
    if(x.error)return fail(x.error);toast("Student jud gaya");await loadBase();stuView()}}

start();
